<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | UNIQUE STTEPS</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet"
    >

</head>

<body>


    <!-- TOP BAR -->

    <div class="topbar">

        <span>
            FREE SHIPPING ON ORDERS ABOVE ₹999
        </span>

        <span class="topbar-hide">
            |
        </span>

        <span class="topbar-hide">
            EASY RETURNS
        </span>

    </div>



    <!-- HEADER -->

    <header class="header">

        <nav class="nav">


            <!-- LOGO -->

            <a href="index.html" class="logo">

                UNIQUE

                <span>
                    STTEPS
                </span>

            </a>



            <!-- DESKTOP NAVIGATION -->

            <div class="navlinks">

                <a href="index.html">
                    HOME
                </a>

                <a href="shop.html">
                    SHOP
                </a>

                <a href="about.html">
                    ABOUT
                </a>

                <a href="contact.html">
                    CONTACT
                </a>

            </div>



            <!-- NAV ICONS -->

            <div class="navicons">


                <!-- SEARCH -->

                <button
                    class="icon-btn"
                    onclick="openSearch()"
                    type="button"
                    aria-label="Search"
                >
                    ⌕
                </button>



                <!-- WISHLIST -->

                <a
                    href="wishlist.html"
                    class="bag-icon"
                    aria-label="Wishlist"
                >
                    ♡
                </a>



                <!-- SHOPPING BAG -->

                <a
                    href="cart.html"
                    class="cart-icon"
                    aria-label="Shopping Bag"
                >
                    🛍

                    <span id="cartCount">
                        0
                    </span>

                </a>



                <!-- MOBILE MENU -->

                <button
                    class="mobile-menu"
                    onclick="toggleMobileMenu()"
                    type="button"
                    aria-label="Menu"
                >
                    ☰
                </button>


            </div>

        </nav>



        <!-- MOBILE NAVIGATION -->

        <div
            class="mobile-nav"
            id="mobileNav"
        >

            <a href="index.html">
                HOME
            </a>

            <a href="shop.html">
                SHOP
            </a>

            <a href="about.html">
                ABOUT
            </a>

            <a href="contact.html">
                CONTACT
            </a>

        </div>

    </header>



    <!-- PRODUCT -->

    <main id="productPage"></main>



    <!-- FOOTER -->

    <footer>


        <div class="footer-top">


            <!-- BRAND -->

            <div class="footer-brand">

                <div class="footer-logo">

                    UNIQUE

                    <span>
                        STTEPS
                    </span>

                </div>

                <p>
                    Your Signature Step. Own The Walk.
                </p>

            </div>



            <!-- SHOP -->

            <div class="footer-column">

                <h4>
                    SHOP
                </h4>

                <a href="shop.html">
                    All Products
                </a>

                <a href="shop.html?cat=heels">
                    Heels
                </a>

                <a href="shop.html?cat=sandals">
                    Sandals
                </a>

            </div>



            <!-- COMPANY -->

            <div class="footer-column">

                <h4>
                    COMPANY
                </h4>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <a href="cart.html">
                    Shopping Bag
                </a>

            </div>


        </div>



        <!-- FOOTER BOTTOM -->

        <div class="footer-bottom">

            <span>
                © 2026 UNIQUE STTEPS
            </span>

            <span>
                ALL RIGHTS RESERVED
            </span>

        </div>


    </footer>



    <!-- SEARCH OVERLAY -->

    <div
        class="search-overlay"
        id="searchBox"
    >

        <button
            class="search-close"
            onclick="closeSearch()"
            type="button"
            aria-label="Close Search"
        >
            ×
        </button>


        <div class="search-inner">

            <span>
                SEARCH
            </span>


            <input
                type="text"
                id="searchInput"
                placeholder="Search heels, sandals..."
                autocomplete="off"
            >


            <div id="searchResults"></div>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
